spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/postgres
spring.datasource.username=user
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Expose H2 console for local testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA defaults for the fallback (will be overridden by profile-specific files)
# Explicit dialect for H2 to avoid "Unable to determine Dialect without JDBC metadata" errors

# Helpful: enable Problem Details support for nicer error responses
spring.mvc.problemdetails.enabled=true