<div class="p-m-3">
  <p-button label="Novo Diretor" icon="pi pi-plus" class="p-mb-3" (click)="abrirDialog()"></p-button>

  <p-table [value]="diretores" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'" class="p-shadow-2">
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let col of colunas">{{col.header}}</th>
        <th>Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td *ngFor="let col of colunas">{{item[col.field]}}</td>
        <td>
          <p-button icon="pi pi-pencil" class="p-button-rounded p-button-success p-mr-2"
            (click)="abrirDialog(item)"></p-button>
          <p-button icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="excluir(item)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{editing ? 'Editar Diretor' : 'Novo Diretor'}}" [(visible)]="displayDialog" [modal]="true"
  [closable]="true">
  <form [formGroup]="diretorForm" (ngSubmit)="salvar()" class="p-fluid">
    <div class="p-field">
      <label for="nome">Nome</label>
      <input id="nome" type="text" pInputText formControlName="nome" />
    </div>

    <p-footer>
      <div class="footer-buttons">
        <p-button label="Cancelar" icon="pi pi-times" (click)="displayDialog = false" class="p-button-text">
        </p-button>

        <p-button label="Salvar" icon="pi pi-check" type="submit">
        </p-button>
      </div>
    </p-footer>
  </form>
</p-dialog>
