<div class="p-m-3">
  <p-button label="Novo Ator" icon="pi pi-plus" class="p-mb-3" (click)="abrirDialog()"></p-button>

  <p-table [value]="atores" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'" class="p-shadow-2">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-ator>
      <tr>
        <td>{{ ator.idAtor }}</td>
        <td>{{ ator.nome }}</td>
        <td>
          <p-button icon="pi pi-pencil" class="p-button-rounded p-button-success p-mr-2" (click)="abrirDialog(ator)">
          </p-button>

          <p-button icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="excluir(ator)">
          </p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>


<p-dialog header="{{ editingAtor ? 'Editar Ator' : 'Novo Ator' }}" [(visible)]="displayDialog" [modal]="true"
  [closable]="true" [style]="{width: '400px'}">
  <form [formGroup]="atorForm" (ngSubmit)="salvar()" class="p-fluid">
    
    <div class="p-field">
      <label for="nome">Nome</label>
      <input id="nome" type="text" pInputText formControlName="nome" />
    </div>

    <p-footer>
      <div class="footer-buttons">
        <p-button label="Cancelar" icon="pi pi-times" (click)="displayDialog = false" class="p-button-text">
        </p-button>

        <p-button label="Salvar" icon="pi pi-check" type="submit">
        </p-button>
      </div>
    </p-footer>
  </form>
</p-dialog>
